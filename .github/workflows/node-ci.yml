name: ci-all
on:
  push:
  pull_request:
  schedule:
    - cron: "0 */6 * * *"   # รันทุก 6 ชั่วโมง
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # เปิด cache ได้ถ้ามี package-lock.json
          cache: npm

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run Node tests (vitest/npm test if present)
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "no npm test script — skip"
          fi

  las:
    # จะรันต่อจาก node (เอาออกได้ถ้าอยากให้รันคู่ขนาน)
    needs: node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser

      - name: Run Pester (auto-fallback if no tests)
        shell: powershell
        run: |
          $tests = Get-ChildItem -Recurse -Filter *.Tests.ps1 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tests) {
            New-Item -ItemType Directory -Force tests | Out-Null
@'
Describe "Smoke" { It "runs" { $true | Should -BeTrue } }
'@ | Set-Content -Encoding UTF8 .\tests\Smoke.Tests.ps1
          }
          Invoke-Pester -CI
