# .github/workflows/node-ci.yml
name: node-ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: npm   # เอาออกเพื่อตัดคำเตือน lockfile

      - name: Force HTTPS for any git deps (best-effort)
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/ || true
          git config --global url."https://github.com/".insteadOf git@github.com: || true
          git config --global url."https://".insteadOf "git+ssh://" || true

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
